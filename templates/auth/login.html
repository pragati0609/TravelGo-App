{% extends "base.html" %}

{% block title %}TravelGo | Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle fs-1 text-primary"></i>
                        <h2 class="fw-bold mt-2">Welcome Back</h2>
                        <p class="text-muted small">Access your bookings and real-time travel alerts</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="user@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-primary ms-1">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
