{% extends "base.html" %}

{% block title %}System Error | TravelGo{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="my-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold">Cloud Service Exception</h3>
        <p class="text-muted">A server error occurred while processing your request. Please try again later.</p>
        <a href="{{ url_for('booking.index') }}" class="btn btn-primary mt-3">Return to Home</a>
    </div>
</div>
{% endblock %}
